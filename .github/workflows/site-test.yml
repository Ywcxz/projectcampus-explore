# Checks the site's rules and story files, then renders it in jsdom, on
# each pull request and on every push to main. The job is named "Site
# test" so it can be required in a ruleset on main.
name: Site test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: Site test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the engine's syntax
        run: node --check js/main.js

      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Check and render the site
        working-directory: tests
        run: npm test
